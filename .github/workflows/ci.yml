name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Generate scrubbed Open XML fixtures
        run: PYTHONPATH=. uv run python scripts/generate_openxml_fixtures.py .artifacts/openxml-fixtures

      - name: Restore pinned Open XML SDK
        run: >-
          dotnet restore
          tools/openxml-validator/Raven.OpenXmlValidator.csproj
          --locked-mode

      - name: Microsoft Open XML SDK validation
        run: >-
          dotnet run
          --project tools/openxml-validator/Raven.OpenXmlValidator.csproj
          --configuration Release
          --no-restore
          -- .artifacts/openxml-fixtures
