[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raven-academic-mcp"
version = "0.1.0"
description = "A safe MCP server for academic editing in Word with native Zotero citations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Raven contributors" }]
keywords = ["mcp", "docx", "zotero", "academic-writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "portalocker>=4.3.0",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
]

[project.scripts]
raven-mcp = "raven_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raven_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "inline-snapshot>=0.35.4",
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "ruff>=0.16.7",
]
